# Container stack.
#
# ## Nothing is configured in this file
#
# Every URL, credential, port and secret below is `${SOMETHING}`, read from the
# `.env` file in this directory. That is the whole point: when the API moves to
# a new host, or the web app gets a real domain, or the database is repointed at
# a managed Postgres, the change is one line in `.env` — no edit to this file,
# no edit to a Dockerfile, no rebuild of anything but the web bundle.
#
#   cp .env.example .env      then set the values for the environment
#
# Compose substitutes an unset variable with an empty string and warns, so a
# missing value surfaces as a warning here and a validation error from the API
# on boot, naming the variable. It never falls back to something that quietly
# works.
#
# ## Two ways to run it
#
#   docker compose up -d                 infrastructure only — Postgres, object
#                                        storage, a mail catcher. Run the API
#                                        and web with `npm run dev` against
#                                        them. This is the normal development
#                                        loop, and it does not build an image.
#
#   docker compose --profile app up -d --build
#                                        the whole application in containers,
#                                        from the same Dockerfiles the
#                                        deployment uses.
#
# ## The administrator account
#
# Created by a one-off command, not on start-up:
#
#   docker compose --profile app run --rm api npm run db:seed:dist -w @ciq/api
#
# See apps/api/prisma/seed.ts for why that is separate from the start command.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ciq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Published on a non-default host port so it cannot collide with a
      # Postgres already installed on the machine.
      - '${POSTGRES_HOST_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for attachments. In production this is swapped
  # for real S3 or Cloudflare R2 by changing S3_ENDPOINT alone.
  minio:
    image: minio/minio:latest
    container_name: ciq-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports:
      - '${MINIO_HOST_PORT}:9000'
      - '${MINIO_CONSOLE_HOST_PORT}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the attachments bucket once MinIO is healthy, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY_ID\" \"$$S3_SECRET_ACCESS_KEY\" &&
      mc mb --ignore-existing \"local/$$S3_BUCKET\" &&
      echo 'bucket ready'
      "

  # Captures outbound mail so digest templates can be inspected without sending.
  # Set MAIL_DRIVER=smtp to route into it; read the inbox on the web port below.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ciq-mailpit
    restart: unless-stopped
    ports:
      - '${SMTP_HOST_PORT}:1025'
      - '${MAILPIT_UI_PORT}:8025'

  # --- Application ---------------------------------------------------------
  # Behind the `app` profile, so the everyday `docker compose up -d` above
  # brings up infrastructure and nothing else.

  api:
    profiles: ['app']
    container_name: ciq-api
    build:
      # The root, not apps/api: the image needs the root manifests and the
      # @ciq/shared workspace, neither of which a narrower context can see.
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Waits for a database that can accept a connection, not merely a container
    # that has started. The entrypoint runs `prisma migrate deploy` before
    # serving, and that fails outright against a Postgres still starting up.
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      # The whole file, so a variable the API reads is available without also
      # being listed below. `required: false` keeps the infrastructure-only path
      # working on a clone that has not copied .env.example yet.
      - path: .env
        required: false
    environment:
      # Listed explicitly only where the container's value must differ from the
      # host's. Everything else arrives through env_file above, unchanged.
      NODE_ENV: production
      PORT: ${API_CONTAINER_PORT}
      # Inside the compose network the database is reached by service name on
      # its own port — not the host port published above.
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      SMTP_HOST: ${DOCKER_SMTP_HOST}
      SMTP_PORT: '1025'
      S3_ENDPOINT: ${DOCKER_S3_ENDPOINT}
    ports:
      - '${API_HOST_PORT}:${API_CONTAINER_PORT}'
    # No healthcheck block — the one in apps/api/Dockerfile is inherited, which
    # keeps a single definition of what healthy means.

  web:
    profiles: ['app']
    container_name: ciq-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the bundle at build time, so this is a build argument and
        # not an environment variable — changing it means rebuilding this image.
        #
        # It is the URL the *browser* uses, so it is the public address of the
        # API, never the `api` service name: that name resolves inside the
        # compose network and nowhere else.
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: ${WEB_CONTAINER_PORT}
    ports:
      - '${WEB_HOST_PORT}:${WEB_CONTAINER_PORT}'

volumes:
  postgres-data:
  minio-data:
