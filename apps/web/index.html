<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Project, drawing, procurement and execution tracking for interior fit-out delivery."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Tints the browser chrome on mobile to match the app surface. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d111b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Installable app. The manifest carries the icons, name and display mode
         for Android and desktop Chrome; iOS ignores it and reads the two
         apple-* tags below instead, which is why both sets are here. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ConstructIQ" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- A login-gated internal tool. Nothing here is for the open web, and a
         crawler that reaches it should index none of it. robots.txt says the
         same thing; this covers the case where somebody links straight in. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Goyal &amp; Co. | Hariyana Group — Project Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so a dark-mode user never sees a white flash.
      (function () {
        try {
          var stored = localStorage.getItem('ciq.theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add(dark ? 'theme-dark' : 'theme-light');
        } catch (e) {
          document.documentElement.classList.add('theme-light');
        }
      })();
    </script>
    <!--
      Runtime configuration, served by the web container and substituted from its
      environment at start-up (see apps/web/nginx.conf.template).

      VITE_API_URL is a *build-time* substitution: Vite compiles it into the
      bundle, so changing it on a running container does nothing and the only way
      to repoint the app is a rebuild. This file lets the container answer the
      question at start-up instead, which is what makes moving the API a restart
      rather than a rebuild.

      Deliberately not `defer`/`async`: it must run before the bundle reads it.
      On a static host (Vercel) there is no container to generate it, the request
      404s, the global stays undefined and the compiled-in value is used — which
      is correct there, because that host rebuilds on every deploy.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /*
       * Registers the service worker, which is what makes the app installable.
       *
       * After load, not during it: registration competes with the bundle for
       * the network otherwise, and nothing on the first paint needs it.
       *
       * Only over HTTPS or on localhost, which is all the browser allows — the
       * guard is here so the console stays clean on a plain-HTTP staging host
       * rather than printing a SecurityError nobody can act on.
       */
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (error) {
            console.warn('Service worker registration failed:', error);
          });
        });
      }
    </script>
  </body>
</html>
