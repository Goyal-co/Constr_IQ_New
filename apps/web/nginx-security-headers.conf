# Security headers, in an include rather than at server level.
#
# nginx's `add_header` does not merge across levels: a location block that
# declares any `add_header` of its own drops every one inherited from the
# server. So headers set once on the server are silently absent from exactly the
# blocks that set a cache policy — including the one serving index.html, which
# is the document these headers most need to protect.
#
# Including the same file in each block is the fix that survives somebody later
# adding a header to a location without realising what it costs.
#
# Mirrors apps/web/vercel.json, so the app behaves the same however it is
# hosted.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
