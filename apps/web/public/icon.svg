<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!--
    The installed-app icon.

    Separate from favicon.svg because the two are cropped differently. A
    favicon is shown as-is; a home-screen icon on Android is masked to whatever
    shape the launcher uses — a circle on most, a squircle on others — and the
    platform guarantees only the middle 80% survives. So the mark here sits
    inside that safe circle and the dark field runs edge to edge, with no
    rounded corner of its own: the launcher supplies the corner, and a rounded
    square inside a circular mask reads as a shrunken, floating tile.

    Colours are baked for the same reason as the favicon: there is no page to
    inherit them from.
  -->
  <rect width="192" height="192" fill="#111827"/>
  <g transform="translate(96 96) scale(0.78) translate(-96 -96)">
    <rect x="44" y="44" width="104" height="104" fill="#ffffff"/>
    <rect x="58" y="44" width="23" height="104" fill="#111827"/>
    <rect x="111" y="44" width="23" height="104" fill="#111827"/>
    <rect x="58" y="85" width="76" height="23" fill="#111827"/>
    <path d="M 50 128 L 152 71 L 110 122 Z" fill="#29ABE2"/>
  </g>
</svg>
